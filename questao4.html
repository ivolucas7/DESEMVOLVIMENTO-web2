<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idade</title>
</head>
<body>

<script>

function calcular () {

var idade = document.getElementById("idade").value;

if (idade <= 12) {

    alert("Idade: " + idade + "\nCriança");

}
else if (idade <= 17) {

    alert("Idade: " + idade + "\nAdolescente");

}
else if (idade <= 59) {

    alert("Idade: " + idade + "\nAdulto");

}
else {

    alert("Idade: " + idade + "\nIdoso");

}

}

</script>

<h2>CLASSIFICAÇÃO DE IDADE</h2>

<label>Idade:</label>
<input type="number" id="idade" placeholder="Digite Aqui...">

<br><br>

<button onclick="calcular()">Enviar</button>

</body>
</html>
