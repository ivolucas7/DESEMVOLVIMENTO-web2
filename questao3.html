<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desconto</title>
</head>
<body>

<script>

function calcular () {

var valor = document.getElementById("valor").value;
var desconto;
var valorFinal;

if (valor <= 100) {

    desconto = 0;
    valorFinal = valor;

    alert("Valor original: R$ " + valor +
    "\nDesconto: 0%" +
    "\nValor final: R$ " + valorFinal);

}
else if (valor <= 500) {

    desconto = valor * 10 / 100;
    valorFinal = valor - desconto;

    alert("Valor original: R$ " + valor +
    "\nDesconto: 10%" +
    "\nValor do desconto: R$ " + desconto.toFixed(2) +
    "\nValor final: R$ " + valorFinal.toFixed(2));

}
else {

    desconto = valor * 15 / 100;
    valorFinal = valor - desconto;

    alert("Valor original: R$ " + valor +
    "\nDesconto: 15%" +
    "\nValor do desconto: R$ " + desconto.toFixed(2) +
    "\nValor final: R$ " + valorFinal.toFixed(2));

}

}

</script>

<h2>CALCULADORA DE DESCONTO</h2>

<label>Valor do produto:</label>
<input type="number" id="valor" placeholder="Digite Aqui...">

<br><br>

<button onclick="calcular()">Calcular</button>

</body>
</html>
